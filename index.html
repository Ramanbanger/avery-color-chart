<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avery Dennison SC950 - Complete Color Chart</title>
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    body { 
      font-family: 'Inter', sans-serif; 
      background-color: #f8fafc; /* Very light background outside the book */
    }

    /* Custom Scrollbar */
    .book-scroll::-webkit-scrollbar { width: 6px; }
    .book-scroll::-webkit-scrollbar-track { background: transparent; }
    .book-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .book-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* Book Page Shadow */
    .page-shadow {
      box-shadow: 
        0 4px 6px -1px rgba(0, 0, 0, 0.05), 
        0 2px 4px -1px rgba(0, 0, 0, 0.03),
        -5px 0 15px -5px rgba(0,0,0,0.05);
    }

    /* Swatch specific styles */
    .swatch-clear {
      background-image: repeating-conic-gradient(#e2e8f0 0% 25%, #ffffff 0% 50%);
      background-size: 12px 12px;
      border: 1px solid #e2e8f0;
    }
    .swatch-metallic::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 40%, rgba(0,0,0,0.1) 100%);
      pointer-events: none;
    }
    
    /* Comparison pane specific */
    .compare-slot-empty {
      background: repeating-linear-gradient(45deg, #f1f5f9, #f1f5f9 10px, #ffffff 10px, #ffffff 20px);
    }
  </style>
</head>
<body class="h-screen w-full flex flex-col overflow-hidden text-slate-800">

  <!-- Header -->
  <header class="h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between shrink-0 z-20 shadow-sm relative">

          Avery Dennison® SC 950 Cut Vinyl Film
        </h1>
        <p class="text-xs text-slate-500 font-medium">Digital Swatch Book (Matches PDF Data)</p>
      </div>
    </div>
    
    <div class="hidden md:flex items-center gap-2 text-sm text-slate-500">
      <span>Select up to 3 colors to compare side-by-side</span>
      <i data-lucide="arrow-right" class="w-4 h-4"></i>
    </div>
  </header>

  <main class="flex-1 w-full flex flex-col lg:flex-row overflow-hidden">
    
    <!-- LEFT SIDE: DIGITAL SWATCH BOOK -->
    <div class="flex-1 h-full flex flex-col md:flex-row bg-slate-50 z-10 relative page-shadow">
      
      <!-- Book Index (Sidebar) -->
      <aside class="w-full md:w-56 bg-white border-r border-slate-200 flex flex-col shrink-0 h-auto md:h-full z-10">
        <div class="p-4 border-b border-slate-200">
          <div class="relative w-full">
            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2.5 text-slate-400"></i>
            <input type="text" id="searchInput" placeholder="Search colors..."
                   class="w-full bg-slate-50 border border-slate-200 rounded-md pl-9 pr-3 py-2 text-sm focus:outline-none focus:border-red-500 focus:bg-white transition-all text-slate-700"
                   oninput="handleSearch()">
          </div>
        </div>

        <div class="px-4 pt-4 pb-2">
          <h2 class="text-[10px] font-bold uppercase tracking-widest text-slate-400">Color Families</h2>
        </div>
        
        <nav class="flex-1 px-2 pb-4 overflow-y-auto book-scroll flex flex-col gap-0.5" id="categoryTabs">
          <!-- Tabs inserted dynamically -->
        </nav>
      </aside>

      <!-- Book Page (Grid) -->
      <div class="flex-1 bg-white h-full flex flex-col relative">
        <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-white/95 backdrop-blur z-10">
          <div>
            <h2 id="pageTitle" class="text-xl font-bold text-slate-900">Whites & Clears</h2>
            <p id="pageSubtitle" class="text-xs text-slate-500 mt-0.5">Opaque Films</p>
          </div>
        </div>
        
        <div class="flex-1 overflow-y-auto p-6 book-scroll bg-white" id="swatchGrid">
          <!-- Swatches inserted dynamically -->
        </div>
      </div>
    </div>

    <!-- RIGHT SIDE: COMPARISON BOARD -->
    <aside class="w-full lg:w-[450px] xl:w-[550px] bg-slate-100 border-l border-slate-200 flex flex-col shrink-0 h-1/3 lg:h-full shadow-inner z-0">
      <div class="p-4 border-b border-slate-200 bg-white flex items-center justify-between">
        <h2 class="text-sm font-bold uppercase tracking-widest text-slate-700 flex items-center gap-2">
          <i data-lucide="layout-panel-left" class="w-4 h-4 text-slate-400"></i>
          Comparison Board
        </h2>
        <button onclick="clearComparison()" class="text-xs text-red-600 hover:text-red-700 font-medium">Clear All</button>
      </div>
      
      <div class="flex-1 p-4 flex gap-3 overflow-x-auto lg:overflow-hidden" id="comparisonSlots">
        <!-- 3 Slots inserted dynamically -->
      </div>
    </aside>

    let activeCategory = "Whites, Clears & Blacks";
    let comparedColors = []; // Max 3 colors

    function init() {
      lucide.createIcons();
      renderTabs();
      renderPage(activeCategory);
      renderComparisonSlots();
    }

    function renderTabs() {
      const nav = document.getElementById('categoryTabs');
      nav.innerHTML = '';
      
      Object.keys(colorDatabase).forEach(cat => {
        const btn = document.createElement('button');
        const isActive = activeCategory === cat;
        
        btn.onclick = () => {
          document.getElementById('searchInput').value = '';
          activeCategory = cat;
          renderTabs();
          renderPage(cat);
        };
        
        btn.className = `w-full text-left px-3 py-2.5 rounded-md text-sm font-medium transition-all flex items-center justify-between
          ${isActive 
            ? 'bg-red-50 text-red-700' 
            : 'bg-transparent text-slate-600 hover:bg-slate-100 hover:text-slate-900'}`;
            
        btn.innerHTML = `
          <span>${cat}</span>
          ${isActive ? `<div class="w-1.5 h-1.5 rounded-full bg-red-600"></div>` : ''}
        `;
        
        nav.appendChild(btn);
      });
    }

    function renderPage(category, filterText = '') {
      const grid = document.getElementById('swatchGrid');
      const title = document.getElementById('pageTitle');
      const subtitle = document.getElementById('pageSubtitle');
      
      grid.innerHTML = '';
      let swatchesToRender = [];
      
      if (filterText) {
        title.textContent = "Search Results";
        subtitle.textContent = `Matching "${filterText}" across all pages`;
        Object.values(colorDatabase).forEach(arr => {
          const matched = arr.filter(c => 
            c.name.toLowerCase().includes(filterText.toLowerCase()) || 
            c.code.toLowerCase().includes(filterText.toLowerCase())
          );
          swatchesToRender.push(...matched);
        });
      } else {
        title.textContent = category;
        swatchesToRender = colorDatabase[category] || [];
        subtitle.textContent = category === "Metallic Films" ? "Metallic Finish" : "Opaque Finish";
      }

      if (swatchesToRender.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 text-sm">No colors found.</div>`;
        return;
      }

      const gridContainer = document.createElement('div');
      gridContainer.className = "grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3";
      
      swatchesToRender.forEach(color => {
        const chip = document.createElement('div');
        
        // Determine if color is already in comparison tray
        const isCompared = comparedColors.some(c => c.code === color.code);
        
        chip.onclick = () => toggleComparison(color);
        chip.className = `group flex flex-col cursor-pointer transition-all duration-200 
          ${isCompared ? 'opacity-50 ring-2 ring-red-500 rounded-md ring-offset-1' : 'hover:-translate-y-0.5'}`;
        
        const isWhite = color.hex === '#ffffff' || color.hex === '#fcfcfc' || color.hex === '#f8f8f8';
        
        // Color block HTML mapping to PDF style
        chip.innerHTML = `
          <div class="w-full aspect-[4/3] rounded-sm relative mb-1.5 shadow-sm
            ${color.isClear ? 'swatch-clear' : ''} 
            ${color.type === 'Metallic' ? 'swatch-metallic' : ''}"
            style="background-color: ${color.isClear ? 'transparent' : color.hex}; 
                   ${isWhite ? 'border: 1px solid #e2e8f0;' : ''}">
          </div>
          <div class="px-0.5">
            <div class="text-xs font-bold text-slate-800 leading-tight group-hover:text-red-600 transition-colors truncate" title="${color.name}">${color.name}</div>
            <div class="text-[10px] text-slate-500 font-medium">#${color.code}</div>
          </div>
        `;
        
        gridContainer.appendChild(chip);
      });
      
      grid.appendChild(gridContainer);
    }

    function handleSearch() {
      const val = document.getElementById('searchInput').value;
      if (val.trim() === '') {
        renderTabs();
        renderPage(activeCategory);
      } else {
        renderPage(null, val);
      }
    }

    function toggleComparison(color) {
      const index = comparedColors.findIndex(c => c.code === color.code);
      if (index > -1) {
        // Remove if already exists
        comparedColors.splice(index, 1);
      } else {
        // Add if space available (Max 3)
        if (comparedColors.length < 3) {
          comparedColors.push(color);
        } else {
          // Replace last one if full
          comparedColors[2] = color;
        }
      }
      // Re-render both views to update selection states
      renderComparisonSlots();
      renderPage(activeCategory, document.getElementById('searchInput').value);
    }

    function removeComparison(code) {
      comparedColors = comparedColors.filter(c => c.code !== code);
      renderComparisonSlots();
      renderPage(activeCategory, document.getElementById('searchInput').value);
    }

    function clearComparison() {
      comparedColors = [];
      renderComparisonSlots();
      renderPage(activeCategory, document.getElementById('searchInput').value);
    }

    function renderComparisonSlots() {
      const container = document.getElementById('comparisonSlots');
      container.innerHTML = '';

      for (let i = 0; i < 3; i++) {
        const color = comparedColors[i];
        const slot = document.createElement('div');
        slot.className = "flex-1 min-w-[120px] rounded-lg border border-slate-200 overflow-hidden flex flex-col bg-white shadow-sm";
        
        if (color) {
           const isWhite = color.hex === '#ffffff' || color.hex === '#fcfcfc' || color.hex === '#f8f8f8';
           slot.innerHTML = `
            <div class="flex-1 w-full relative 
              ${color.isClear ? 'swatch-clear' : ''} 
              ${color.type === 'Metallic' ? 'swatch-metallic' : ''}"
              style="background-color: ${color.isClear ? 'transparent' : color.hex};
                     ${isWhite ? 'border-bottom: 1px solid #e2e8f0;' : ''}">
              <button onclick="removeComparison('${color.code}')" class="absolute top-2 right-2 w-6 h-6 bg-black/20 hover:bg-black/40 backdrop-blur rounded-full flex items-center justify-center text-white transition-colors">
                <i data-lucide="x" class="w-3 h-3"></i>
              </button>
            </div>
            <div class="p-3 bg-white border-t border-slate-100 flex flex-col justify-between h-[80px]">
              <div>
                <p class="text-sm font-bold text-slate-900 leading-tight">${color.name}</p>
                <p class="text-xs text-slate-500 mt-0.5">SC950-${color.code}</p>
              </div>
              <p class="text-[10px] font-semibold text-slate-400 uppercase">${color.type}</p>
            </div>
          `;
        } else {
          slot.innerHTML = `
            <div class="flex-1 w-full compare-slot-empty flex flex-col items-center justify-center text-slate-400">
              <i data-lucide="plus-circle" class="w-6 h-6 mb-2 opacity-50"></i>
              <span class="text-xs font-medium px-4 text-center">Select color<br>from book</span>
            </div>
          `;
        }
        
        container.appendChild(slot);
      }
      lucide.createIcons();
    }

    // Initialize on load
    window.onload = init;
  </script>
</body>
</html>
